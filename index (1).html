<!DOCTYPE html>
<html>
<head>
  <title>Website with Contact Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      color: #333;
      text-align: center;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      background-color: #333366;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    input, textarea {
      padding: 10px;
      width: 80%;
      max-width: 400px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .section {
      display: none;
      margin-top: 20px;
    }

    .active {
      display: block;
    }

    .dark-mode {
      background-color: #1a1a1a;
      color: #f2f2f2;
    }

    .dark-mode button {
      background-color: #555;
    }

    .dark-mode input,
    .dark-mode textarea {
      background-color: #333;
      color: white;
      border: 1px solid #666;
    }
  </style>
</head>
<body id="pageBody">
  <h1>My Website</h1>

  <!-- Navigation buttons -->
  <button onclick="showSection('home')">Home</button>
  <button onclick="showSection('about')">About Me</button>
  <button onclick="showSection('projects')">Projects</button>
  <button onclick="showSection('contact')">Contact</button>
  <button onclick="toggleMode()">Toggle Light/Dark</button>

  <!-- Sections -->
  <div id="home" class="section active">
    <h2>Welcome!</h2>
    <p>This is the home page of my awesome site.</p>
  </div>

  <div id="about" class="section">
    <h2>About Me</h2>
    <p>Hi! I'm learning to build websites step by step.</p>
  </div>

  <div id="projects" class="section">
    <h2>My Projects</h2>
    <p>Coming soon: cool things I'm building!</p>
  </div>

  <div id="contact" class="section">
    <h2>Contact Me</h2>
    <form action="https://formspree.io/f/xovergjq" method="POST">
      <input type="text" name="name" placeholder="Your Name" required><br>
      <input type="email" name="email" placeholder="Your Email" required><br>
      <textarea name="message" placeholder="Your Message" rows="5" required></textarea><br>
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    function showSection(sectionId) {
      const sections = document.getElementsByClassName('section');
      for (let i = 0; i < sections.length; i++) {
        sections[i].classList.remove('active');
      }
      document.getElementById(sectionId).classList.add('active');
    }

    function toggleMode() {
      const body = document.getElementById('pageBody');
      body.classList.toggle('dark-mode');
    }
  </script>
</body>
</html>
